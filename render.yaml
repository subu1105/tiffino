# Render blueprint — deploys the TIFFINO API from this repo.
# In Render: New + → Blueprint → connect this repo → it reads this file.
services:
  - type: web
    name: tiffino-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tiffino/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      # Set these in the Render dashboard (kept out of git):
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      # Your web domain(s), comma-separated — e.g. https://yourdomain.com,https://www.yourdomain.com
      - key: CORS_ORIGINS
        sync: false
